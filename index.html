<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My To-Do List</title>
</head>

<body>
    <div class="container">
        <!-- Heading -->
        <h1>MY TO-DO LIST</h1>
        <p>Organize your daily task!</p>

        <!-- Task Input -->
        <div class="input-section">
            <input id="taskInput" type="text" placeholder="Please enter your task">
            <button id="addTaskBtn">Add</button>
        </div>

        <!-- Task List -->
        <div class="task-section">
            <h2>Daily Task Manager</h2>

            <!-- Search input -->
            <div class="search-section">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search your tasks..."
                >
            </div>

            <!-- Task filter buttons -->
            <div class="filter-section">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <ul id="taskList">
                <li>
                    <input type="checkbox">
                    <span>Eating</span>
                    <button class="edit-btn" type="button">Edit</button>
                    <button type="button">Delete</button>
                </li>

                <li>
                    <input type="checkbox">
                    <span>Reading</span>
                    <button class="edit-btn" type="button">Edit</button>
                    <button type="button">Delete</button>
                </li>

                <li>
                    <input type="checkbox">
                    <span>Sleeping</span>
                    <button class="edit-btn" type="button">Edit</button>
                    <button type="button">Delete</button>
                </li>

            </ul>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
